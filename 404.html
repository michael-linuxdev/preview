<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden – Michael</title>
<meta name="description" content="Die angeforderte Seite wurde nicht gefunden.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<style>
@font-face{
  font-family:"Inter Web";font-style:normal;font-weight:100 900;font-display:swap;
  src:url("/fonts/inter-latin-wght-normal.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Inter Web";font-style:normal;font-weight:100 900;font-display:swap;
  src:url("/fonts/inter-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
:root{
  --bg:#f6f4ef;
  --bg-soft:#edeae2;
  --surface:#fffefb;
  --text:#1d2421;
  --muted:#575e57;
  --accent:#1e6b64;
  --accent-hover:#175650;
  --accent-text:#ffffff;
  --accent-soft:#dceae6;
  --accent-ink:#1a5f59;
  --border:#e0dcd1;
  --focus:#1a5f59;
  --disabled-bg:#ebe8e1;
  --disabled-text:#575e57;
  --disabled-border:#cdc8bb;
  --shadow-sm:0 1px 2px rgba(29,36,33,.05);
  --shadow:0 1px 2px rgba(29,36,33,.04),0 8px 24px -8px rgba(29,36,33,.10);
  --shadow-hover:0 2px 4px rgba(29,36,33,.05),0 14px 30px -10px rgba(29,36,33,.14);
  --shadow-lg:0 2px 4px rgba(29,36,33,.04),0 18px 40px -12px rgba(29,36,33,.16);
  --radius:24px;
  --radius-lg:28px;
  --radius-sm:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111917;
    --bg-soft:#15201d;
    --surface:#1d2b27;
    --text:#e9efec;
    --muted:#a9b8b2;
    --accent:#6cc2b5;
    --accent-hover:#8ad2c7;
    --accent-text:#0c1513;
    --accent-soft:#20403a;
    --accent-ink:#86d0c4;
    --border:#2c403a;
    --focus:#8ad2c7;
    --disabled-bg:#141e1b;
    --disabled-text:#9eada7;
    --disabled-border:#344a44;
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
    --shadow:0 1px 2px rgba(0,0,0,.22),0 8px 24px -10px rgba(0,0,0,.4);
    --shadow-hover:0 2px 4px rgba(0,0,0,.24),0 14px 30px -12px rgba(0,0,0,.5);
    --shadow-lg:0 2px 4px rgba(0,0,0,.2),0 18px 40px -14px rgba(0,0,0,.45);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter Web","Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(1.0625rem,1rem + .25vw,1.125rem);line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
h2{letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
p{text-wrap:pretty}
.hero h1 .accent,.hero .lead{text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip-link{
  position:absolute;left:1rem;top:1rem;z-index:100;
  background:var(--surface);color:var(--text);padding:.75rem 1.1rem;border-radius:12px;
  box-shadow:var(--shadow-lg);font-weight:600;text-decoration:none;
  transform:translateY(-200%);transition:transform .15s ease;
}
.skip-link:focus,.skip-link:focus-visible{transform:none}
.container{width:100%;max-width:1160px;margin-inline:auto;padding-inline:clamp(1.25rem,4vw,2.5rem);padding-left:max(clamp(1.25rem,4vw,2.5rem),env(safe-area-inset-left,0px));padding-right:max(clamp(1.25rem,4vw,2.5rem),env(safe-area-inset-right,0px))}
section{padding-block:clamp(4rem,9vw,7rem)}
.eyebrow{
  display:inline-block;font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:1rem;
}
.section-head{max-width:44rem;margin-bottom:clamp(2.5rem,5vw,3.5rem)}
.section-head h2{font-size:clamp(1.75rem,3.2vw,2.375rem)}
.section-head p{color:var(--muted);margin-top:1rem;font-size:1.125rem;max-width:65ch}

/* Hero */
.hero{padding-block:clamp(5rem,13vw,9rem) clamp(4rem,9vw,6.5rem);position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:-30% -10% auto auto;width:min(720px,90vw);aspect-ratio:1;
  background:radial-gradient(closest-side,var(--accent-soft),transparent 70%);
  z-index:-1;pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:2rem}
.hero-inner{max-width:50rem}
.hero-art{display:none}
@media (min-width:1000px){.hero::before{opacity:.55}}
@media (min-width:1000px){
  .hero-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:3rem}
  .hero-art{display:block;position:relative;width:100%;max-width:440px;justify-self:end;aspect-ratio:1}
  .hero-art svg{width:100%;height:100%;display:block;overflow:visible}
}
.hero-art .a-fill{fill:var(--accent)}
.hero-art .a-stroke{stroke:var(--accent);fill:none}
.hero-art .a-surface{fill:var(--surface);stroke:var(--border)}
.hero-art .a-soft{fill:var(--accent-soft)}
.hero .role{
  display:inline-flex;align-items:center;gap:.6rem;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
  padding:.45rem 1rem .45rem .75rem;border-radius:999px;font-size:.9375rem;font-weight:500;color:var(--muted);
  margin-bottom:1.75rem;
}
@media (max-width:420px){.hero .role{font-size:.8125rem;padding:.4rem .85rem .4rem .65rem;gap:.5rem}}
@media (max-width:380px){.hero .role{font-size:.75rem;letter-spacing:0}}
@media (max-width:359.98px){.hero .role{font-size:.6875rem;padding:.35rem .7rem .35rem .55rem;gap:.4rem}}
.hero .role .dot{flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--accent)}
.hero h1{font-size:clamp(2.5rem,6.2vw,4.25rem);letter-spacing:-.03em;line-height:1.05}
.hero h1 .accent{color:var(--accent-ink);display:block;font-weight:600;font-size:.52em;letter-spacing:-.02em;margin-top:.75rem}
.hero .lead{font-size:clamp(1.125rem,1.8vw,1.3125rem);color:var(--muted);margin-top:1.75rem;max-width:min(40rem,65ch)}
.actions{display:flex;flex-wrap:wrap;gap:.875rem;margin-top:2.5rem}
.btn{
  display:inline-flex;align-items:center;gap:.6rem;justify-content:center;
  min-height:3.25rem;padding:.85rem 1.6rem;border-radius:999px;
  font:inherit;font-weight:600;font-size:1rem;text-decoration:none;
  transition:background-color .2s ease,box-shadow .2s ease,transform .2s ease,border-color .2s ease;
}
.btn-primary{background:var(--accent);color:var(--accent-text);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.btn-secondary:hover{border-color:var(--accent)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn-disabled{background:var(--disabled-bg);color:var(--disabled-text);border:1px dashed var(--disabled-border);box-shadow:none;cursor:default;user-select:none}
.contact-pending{display:inline-flex;align-items:center;gap:.45rem;color:var(--disabled-text);cursor:default}
.contact-pending svg{width:1em;height:1em;flex:none}



/* Leistungen – Karten */
section.group{padding:0}
.groups{display:grid;gap:clamp(2.5rem,5vw,3rem);grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.groups{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem}}
.group-head{margin-bottom:1.25rem;padding-inline:.25rem}
.group-head h4{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:.65rem}
.group-head h4::before{content:"";width:.6rem;height:.6rem;border-radius:999px;background:var(--accent);flex:none}
.group-head p{color:var(--muted);font-size:.975rem;margin-top:.4rem}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (max-width:999.98px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.5rem 1.5rem 1.6rem;box-shadow:var(--shadow);height:100%;
  transition:box-shadow .25s ease,transform .25s ease;
}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:.9rem;margin-bottom:.75rem}
.icon{
  width:2.75rem;height:2.75rem;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent-ink);
}
.icon svg{width:1.4rem;height:1.4rem}
.card h5{font-size:1.0625rem;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0;hyphens:auto;overflow-wrap:break-word}
.card p{color:var(--muted);font-size:.975rem;line-height:1.6}

/* Leistungen im Detail (Disclosure) */
.more{margin-top:clamp(2rem,4vw,2.5rem)}
.more>summary{
  list-style:none;display:flex;align-items:center;justify-content:center;gap:.6rem;width:fit-content;margin-inline:auto;
  min-height:3rem;padding:.75rem 1.4rem;border-radius:999px;cursor:pointer;text-align:center;user-select:none;
  background:var(--surface);color:var(--accent-ink);font-weight:600;
  border:1px solid color-mix(in srgb,var(--accent) 75%,var(--border));box-shadow:var(--shadow-sm);
  transition:background-color .2s ease,box-shadow .2s ease;
}
.more>summary::-webkit-details-marker{display:none}
.more>summary::marker{content:""}
.more>summary:hover{background:var(--accent-soft);box-shadow:var(--shadow)}
.more>summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.more .chev{width:1.15rem;height:1.15rem;flex:none;transition:transform .25s ease}
.more[open] .chev{transform:rotate(180deg)}
.more .lbl-close,.more[open] .lbl-open{display:none}
.more[open] .lbl-close{display:inline}
.more-body{padding-top:clamp(2.5rem,5vw,3.5rem)}
.more-head h3{font-size:clamp(1.5rem,2.8vw,2rem)}
@media (prefers-reduced-motion:reduce){.more .chev,.more>summary{transition:none}}

/* IT-Beratung */
#angebot{background:var(--bg-soft)}
.offer-dev{margin-top:clamp(2.5rem,5vw,3.5rem)}
.offer{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:clamp(2rem,5vw,3.5rem);display:grid;gap:clamp(2rem,4vw,3rem);grid-template-columns:minmax(0,1fr);
}
@media (min-width:900px){.offer{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}}
.offer-main h2{font-size:clamp(1.75rem,3.2vw,2.375rem)}
.offer-main p{color:var(--muted);margin-top:1rem;font-size:1.125rem;max-width:60ch}
.offer-main p.offer-note{font-size:1rem;margin-top:1.5rem;color:var(--text);font-weight:500}
.offer-focus{border-top:1px solid var(--border);padding-top:2rem}
@media (min-width:900px){.offer-focus{border-top:0;padding-top:.35rem;border-left:1px solid var(--border);padding-left:clamp(2rem,4vw,3rem)}}
.offer-focus h3{font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.focus-list{list-style:none;margin:0;padding:0}
.focus-list li{display:flex;align-items:center;gap:.75rem;padding:.8rem 0;border-bottom:1px solid var(--border);font-weight:500}
.focus-list li:last-child{border-bottom:0}
.focus-list li::before{content:"";width:.5rem;height:.5rem;border-radius:999px;background:var(--accent);flex:none}

/* Ansatz – Zeitstrahl */
.steps{
  --marker:3rem;--line:color-mix(in srgb,var(--accent) 45%,var(--border));
  list-style:none;margin:0;padding:0;counter-reset:step;display:grid;gap:0;grid-template-columns:minmax(0,1fr);
}
.step{counter-increment:step;position:relative;display:grid;grid-template-columns:var(--marker) minmax(0,1fr);column-gap:1.25rem;padding-bottom:2.25rem}
.step:last-child{padding-bottom:0}
.step::before{
  content:counter(step,decimal-leading-zero);grid-row:1 / span 2;
  display:grid;place-items:center;width:var(--marker);height:var(--marker);border-radius:999px;
  background:var(--accent);color:var(--accent-text);font-weight:700;font-size:.9375rem;
  font-variant-numeric:tabular-nums;box-shadow:0 0 0 6px var(--bg),var(--shadow-sm);position:relative;z-index:1;
}
.step:not(:last-child)::after{
  content:"";position:absolute;left:calc(var(--marker) / 2 - 1px);top:var(--marker);bottom:0;width:2px;
  background:var(--line);border-radius:2px;
}
.step h3{font-size:1.1875rem;margin:.65rem 0 .5rem}
.step p{color:var(--muted);font-size:.975rem;max-width:34ch}
@media (min-width:900px){
  .steps{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:2rem}
  .step{display:block;padding-bottom:0;padding-right:.5rem}
  .step::before{margin-bottom:1.5rem}
  .step:not(:last-child)::after{left:calc(var(--marker) + 1rem);right:-1rem;top:calc(var(--marker) / 2 - 1px);bottom:auto;width:auto;height:2px}
  .step h3{margin-top:0}
}
.principles{list-style:none;padding:0;margin:clamp(2.5rem,5vw,3.5rem) 0 0;display:flex;flex-wrap:wrap;gap:.75rem}
.principles li{
  display:inline-flex;align-items:center;gap:.55rem;padding:.55rem 1rem;border-radius:999px;
  background:var(--accent-soft);color:var(--text);font-size:.9375rem;font-weight:500;
}
.principles svg{width:1rem;height:1rem;color:var(--accent-ink);flex:none}

/* CTA */
.cta{padding-top:0}
.cta-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:clamp(2.25rem,6vw,4rem);
  display:grid;gap:2rem;align-items:center;position:relative;overflow:hidden;isolation:isolate;
}
.cta-box::after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(closest-side,var(--accent-soft),transparent 72%);z-index:-1;
}
@media (min-width:880px){.cta-box{grid-template-columns:1.4fr auto}}
.cta-box h2{font-size:clamp(1.75rem,3.2vw,2.375rem)}
.cta-box p{color:var(--muted);margin-top:1rem;font-size:1.125rem;max-width:36rem}
.cta-mail{margin-top:1.25rem;font-size:1rem;color:var(--muted)}
.cta-mail a{font-weight:600}

footer{border-top:1px solid var(--border);padding-block:2.5rem;color:var(--muted);font-size:.9375rem}
.num{font-variant-numeric:tabular-nums}
.footer-inner{display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.footer-inner{grid-template-columns:minmax(0,1fr) auto;align-items:start}.footer-meta{text-align:right}}
.footer-name{color:var(--text);font-weight:600}
.footer-meta{display:grid;gap:.35rem}
.footer-legal{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
@media (min-width:720px){.footer-legal{justify-content:flex-end}}

/* Mobile: Erstansicht füllt den Bildschirm */
@media (max-width:767.98px){
  .hero::before{display:none}
  .hero{
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
    padding-top:calc(env(safe-area-inset-top,0px) + clamp(1.5rem,6svh,3.25rem));
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + clamp(1.25rem,4svh,2rem));
  }
  .hero-grid{flex:1 1 auto;display:flex;flex-direction:column;align-items:stretch;gap:0}
  .hero-inner{display:contents}
  .hero .role{align-self:flex-start;margin-bottom:clamp(1.25rem,4.5svh,2.25rem)}
  .hero h1{font-size:clamp(3rem,16.5vw,4.5rem);line-height:1;letter-spacing:-.035em}
  .hero h1 .accent{font-size:clamp(1.4375rem,6.4vw,1.875rem);line-height:1.18;margin-top:clamp(.7rem,2svh,1rem);letter-spacing:-.022em}
  .hero .lead{font-size:clamp(1.0625rem,4.5vw,1.1875rem);line-height:1.6;margin-top:clamp(1rem,3svh,1.5rem)}
  .hero-art{
    display:block;order:2;flex:1 1 0;min-height:0;position:relative;width:100%;
    margin-block:clamp(.75rem,2.5svh,1.5rem);container-type:size;
  }
  .hero-art svg{display:block;width:100%;height:100%;max-height:17rem;margin-inline:auto;overflow:visible}
  @container (max-height:104px){.hero-art svg{display:none}}
  .actions{order:3;margin-top:0;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:.375rem}
  .actions .btn-primary{width:100%;min-height:3.5rem;font-size:1.0625rem}
  .actions .btn-disabled{
    background:none;border:0;box-shadow:none;min-height:2.75rem;padding:0;
    font-weight:500;font-size:1rem;color:var(--disabled-text);gap:.5rem;
  }
}
@media (max-width:767.98px) and (max-height:500px){
  .hero{min-height:0;padding-top:calc(env(safe-area-inset-top,0px) + 2rem);padding-bottom:2.5rem}
  .hero-art{display:none}
  .actions{flex-direction:row;align-items:center;margin-top:1.75rem;gap:1.25rem}
  .actions .btn-primary{width:auto}
}
@media (max-height:500px) and (orientation:landscape){
  .hero{padding-top:calc(env(safe-area-inset-top,0px) + 2rem);padding-bottom:2.5rem}
  .hero::before{display:none}
}
/* Mobile: übrige Abschnitte */
@media (max-width:599.98px){
  section{padding-block:3.5rem}
  .offer{padding:1.75rem 1.25rem;border-radius:20px;gap:1.75rem}
  .offer-main p{font-size:1.0625rem}
  .offer-focus{padding-top:1.5rem}
  .cta-box{padding:2rem 1.25rem;border-radius:20px}
  .card{padding:1.25rem 1.25rem 1.35rem;border-radius:18px}
  .card p,.step p,.group-head p{font-size:1rem}
  .principles li{font-size:1rem}
  .more>summary{width:100%}
  .more-body{padding-top:2.5rem}
  footer{font-size:1rem;padding-bottom:calc(2.5rem + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .btn-primary:hover{transform:none}
}
@media (forced-colors: active){
  .btn,.offer,.cta-box{border:1px solid CanvasText}
  .focus-list li::before{background:CanvasText}
  .step::before{border:2px solid CanvasText}
  .step:not(:last-child)::after{background:CanvasText}
}
@media print{
  @page{margin:18mm 16mm}
  :root{--bg:#fff;--bg-soft:#fff;--surface:#fff;--text:#000;--muted:#222;--accent:#000;--accent-text:#fff;--accent-ink:#000;--accent-soft:#fff;--border:#999}
  html,body{background:#fff!important;color:#000!important;font-size:11pt;line-height:1.5}
  *,*::before,*::after{box-shadow:none!important;text-shadow:none!important;transition:none!important}
  .skip-link,.hero-art,.hero::before,.cta-box::after,.icon,.btn svg,.principles svg,.btn-secondary,a.btn[href^="#"]{display:none!important}
  section{padding-block:10mm 0}
  .hero{padding-top:0}
  .hero h1 .accent{color:#000}
  .container{max-width:none;padding-inline:0}
  .offer{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8mm}
  .offer-dev{margin-top:8mm}
  .offer,.cta-box{border:1px solid #999;border-radius:8px;padding:5mm 6mm}
  .offer-focus{border-left:1px solid #999;border-top:0;padding:0 0 0 6mm}
  .focus-list li{padding:1.5mm 0;border-color:#ccc}
  .focus-list li::before{background:#000}
  .offer,.step,.cta-box,.principles li{break-inside:avoid;page-break-inside:avoid}
  h2,h3,h4,.section-head{break-after:avoid;page-break-after:avoid}
  .section-head,.steps{break-inside:avoid;page-break-inside:avoid}
  .more>summary{display:none!important}
  .more::details-content{content-visibility:visible!important;display:block!important}
  .more>.more-body{display:block!important;padding-top:8mm}
  .groups{grid-template-columns:minmax(0,1fr);gap:6mm}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:4mm}
  .card{border:1px solid #999;border-radius:8px;padding:4mm 5mm;background:#fff}
  .card,.group-head{break-inside:avoid;page-break-inside:avoid}
  .group-head h4::before{background:#000}
  h5{break-after:avoid;page-break-after:avoid}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:6mm}
  .step{display:block;padding:0}
  .step::before{background:#fff;color:#000;border:1.5px solid #000;width:2.25rem;height:2.25rem;margin-bottom:2mm}
  .step:not(:last-child)::after{display:none}
  .principles li{background:#fff;border:1px solid #999}
  .btn-disabled{border:1px dashed #555!important;color:#333!important}
  .btn{border:1px solid #000;background:#fff!important;color:#000!important;min-height:0;padding:2mm 4mm}
  a{color:#000;text-decoration:underline}
  a[href^="http"]::after{content:" (" attr(href) ")";font-weight:400;word-break:break-all}
  .cta-mail a::after,.footer-meta a::after{content:none}
  footer{border-top:1px solid #999;padding-block:5mm 0}
}
.notfound{min-height:calc(100vh - 8rem);display:grid;align-items:center}
.notfound .code{font-size:clamp(4.5rem,14vw,8rem);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums;margin-bottom:1.25rem}
.notfound h1{font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.03em}
.notfound .lead{font-size:clamp(1.0625rem,1.6vw,1.25rem);color:var(--muted);margin-top:1.25rem;max-width:min(36rem,65ch)}
@media (max-width:767.98px){.notfound .actions{margin-top:2rem}}
</style>
